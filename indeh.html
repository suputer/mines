<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Создание счёта</title>
    <!-- Официальный скрипт Telegram Web App -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            overflow: hidden;
            position: relative;
            padding: 20px;
            touch-action: none;
        }

        /* Водная физика элементов */
        .water-img {
            position: absolute;
            top: 0;
            left: 0;
            object-fit: contain;
            pointer-events: none;
            will-change: transform;
        }

        /* Верхняя панель: логотипы + кнопка калькулятора */
        .top-bar {
            width: 100%;
            max-width: 380px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: 15px;
            z-index: 10;
        }

        .header-section {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .header-section img {
            width: 45px;
            height: 45px;
            object-fit: contain;
            filter: drop-shadow(0 4px 10px rgba(0, 0, 0, 0.4));
        }

        .arrow-icon {
            font-size: 22px;
            color: #38bdf8;
            font-weight: bold;
            animation: pulse-arrow 1.5s infinite ease-in-out;
        }

        @keyframes pulse-arrow {
            0%, 100% { transform: scale(1); opacity: 0.7; }
            50% { transform: scale(1.2); opacity: 1; }
        }

        /* Кнопка калькулятора в верхнем углу */
        .calc-btn {
            width: 44px;
            height: 44px;
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            transition: all 0.2s ease;
        }

        .calc-btn:hover {
            background: rgba(255, 255, 255, 0.15);
            transform: translateY(-1px);
        }

        .calc-btn:active {
            transform: translateY(1px);
        }

        .calc-btn svg {
            width: 22px;
            height: 22px;
            fill: #38bdf8;
        }

        /* Центральная карточка с полями ввода */
        .center-card {
            background: rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 22px 20px;
            width: 100%;
            max-width: 380px;
            display: flex;
            flex-direction: column;
            gap: 14px;
            z-index: 10;
            margin: auto 0;
            pointer-events: auto;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4);
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
            text-align: left;
        }

        .label-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
            color: #94a3b8;
            font-weight: 500;
        }

        .error-hint {
            font-size: 11px;
            color: #ef4444;
            display: none;
            font-weight: 600;
        }

        .input-group.error-state .error-hint {
            display: block;
        }

        .input-group.error-state .label-row label {
            color: #ef4444;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .center-card input {
            width: 100%;
            padding: 13px 44px 13px 16px;
            background: rgba(0, 0, 0, 0.25);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 14px;
            color: #fff;
            font-size: 16px;
            outline: none;
            transition: all 0.3s ease;
        }

        .center-card input::placeholder {
            color: rgba(255, 255, 255, 0.3);
        }

        .center-card input:focus {
            border-color: #38bdf8;
            box-shadow: 0 0 12px rgba(56, 189, 248, 0.35);
            background: rgba(0, 0, 0, 0.4);
        }

        .center-card input.error-field {
            border-color: #ef4444 !important;
            box-shadow: 0 0 12px rgba(239, 68, 68, 0.5) !important;
            animation: shake 0.3s ease-in-out;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }

        .input-icon {
            position: absolute;
            right: 14px;
            width: 24px;
            height: 24px;
            object-fit: contain;
            pointer-events: none;
        }

        .brand-tag {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.35);
            text-align: center;
            z-index: 10;
            margin-top: 4px;
            letter-spacing: 0.5px;
        }

        /* Кнопка внизу */
        .bottom-container {
            width: 100%;
            max-width: 380px;
            margin-bottom: 25px;
            z-index: 10;
            pointer-events: auto;
        }

        .confirm-btn {
            width: 100%;
            padding: 18px;
            background: linear-gradient(135deg, #475569 0%, #334155 100%);
            color: #ffffff;
            border: none;
            border-radius: 16px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(71, 85, 105, 0.3);
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 58px;
        }

        .confirm-btn.active {
            background: linear-gradient(135deg, #22c55e 0%, #15803d 100%);
            box-shadow: 0 6px 20px rgba(34, 197, 94, 0.35);
        }

        .confirm-btn:hover {
            transform: translateY(-2px);
        }

        .confirm-btn:active {
            transform: translateY(1px);
        }

        /* Спиннер загрузки на кнопке */
        .spinner {
            width: 24px;
            height: 24px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Модальное окно успешной оплаты */
        .success-overlay {
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, 0.9);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 200;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
            padding: 20px;
        }

        .success-overlay.open {
            opacity: 1;
            pointer-events: auto;
        }

        .success-card {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 24px;
            padding: 30px 24px;
            width: 100%;
            max-width: 320px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.6);
            text-align: center;
        }

        .success-card img {
            width: 64px;
            height: 64px;
            object-fit: contain;
            filter: drop-shadow(0 4px 15px rgba(56, 189, 248, 0.4));
        }

        .success-card h2 {
            font-size: 20px;
            font-weight: 600;
            color: #ffffff;
        }

        .close-success-btn {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #22c55e 0%, #15803d 100%);
            color: #ffffff;
            border: none;
            border-radius: 14px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(34, 197, 94, 0.3);
            transition: transform 0.2s;
        }

        .close-success-btn:hover {
            transform: translateY(-1px);
        }

        /* Модальное окно калькулятора */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
            padding: 20px;
        }

        .modal-overlay.open {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-card {
            background: linear-gradient(135deg, #1e1b4b 0%, #0f172a 100%);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 24px;
            padding: 24px;
            width: 100%;
            max-width: 360px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.6);
            display: flex;
            flex-direction: column;
            gap: 16px;
            position: relative;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 17px;
            font-weight: 600;
            color: #f1f5f9;
            margin-bottom: 4px;
        }

        .modal-close {
            background: none;
            border: none;
            color: #94a3b8;
            font-size: 22px;
            cursor: pointer;
            padding: 4px;
            line-height: 1;
            transition: color 0.2s;
        }

        .modal-close:hover {
            color: #fff;
        }

        .modal-inputs {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .modal-input-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
            text-align: left;
        }

        .modal-input-group label {
            font-size: 12px;
            color: #94a3b8;
        }

        .modal-input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .modal-input-wrapper input {
            width: 100%;
            padding: 12px 44px 12px 14px;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 12px;
            color: #fff;
            font-size: 15px;
            outline: none;
        }

        .modal-input-wrapper input:focus {
            border-color: #38bdf8;
            box-shadow: 0 0 10px rgba(56, 189, 248, 0.3);
        }

        .modal-icon {
            position: absolute;
            right: 12px;
            width: 22px;
            height: 22px;
            object-fit: contain;
            pointer-events: none;
        }

        .swap-btn {
            width: 100%;
            padding: 14px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 14px;
            color: #ffffff;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: background 0.2s;
            margin-top: 4px;
        }

        .swap-btn:hover {
            background: rgba(255, 255, 255, 0.15);
        }

        .swap-btn svg {
            width: 18px;
            height: 18px;
            fill: #38bdf8;
        }
    </style>
</head>
<body>

    <!-- Верхняя панель: Логотипы и кнопка калькулятора -->
    <div class="top-bar">
        <div class="header-section">
            <img src="stars.png" alt="Stars" onerror="this.src='https://via.placeholder.com/45?text=⭐'">
            <div class="arrow-icon">➔</div>
            <img src="gram.png" alt="Gram" onerror="this.src='https://via.placeholder.com/45?text=💎'">
        </div>
        <div class="calc-btn" id="open-calc">
            <svg viewBox="0 0 24 24"><path d="M19,3H5C3.89,3 3,3.89 3,5V19C3,20.1 3.89,21 5,21H19C20.1,21 21,20.1 21,19V5C21,3.89 20.1,3 19,3M19,5V7H5V5H19M5,9H9V13H5V9M11,9H15V13H11V9M17,9H19V15H17V9M5,15H11V19H5V15M13,15H15V19H13V15M17,17H19V19H17V17Z"/></svg>
        </div>
    </div>

    <!-- Центральный блок с полями ввода -->
    <div class="center-card">
        <div class="input-group" id="group-id">
            <div class="label-row">
                <label for="telegram-id">Telegram ID</label>
                <span class="error-hint" id="hint-id">Введите ID!</span>
            </div>
            <div class="input-wrapper">
                <input type="text" id="telegram-id" inputmode="numeric" placeholder="123456789">
                <img src="id.png" alt="ID" class="input-icon" onerror="this.style.display='none'">
            </div>
        </div>
        <div class="input-group" id="group-stars">
            <div class="label-row">
                <label for="stars-amount">Сумма в звёздах</label>
                <span class="error-hint" id="hint-stars">Введите сумму Stars!</span>
            </div>
            <div class="input-wrapper">
                <input type="text" id="stars-amount" inputmode="numeric" placeholder="100">
                <img src="stars.png" alt="Stars" class="input-icon" onerror="this.style.display='none'">
            </div>
        </div>
        <div class="brand-tag">@sg_change</div>
    </div>

    <!-- Кнопка внизу -->
    <div class="bottom-container">
        <button class="confirm-btn">Создать счёт</button>
    </div>

    <!-- Окно успешной оплаты -->
    <div class="success-overlay" id="success-modal">
        <div class="success-card">
            <img src="gram.png" alt="Gram" onerror="this.src='https://via.placeholder.com/64?text=💎'">
            <h2>GRAM отправлены!</h2>
            <button class="close-success-btn" id="close-success">Закрыть</button>
        </div>
    </div>

    <!-- Модальное окно калькулятора -->
    <div class="modal-overlay" id="calc-modal">
        <div class="modal-card">
            <div class="modal-header">
                <span>Калькулятор курса</span>
                <button class="modal-close" id="close-calc">✕</button>
            </div>
            <div class="modal-inputs" id="modal-inputs-container">
                <div class="modal-input-group" id="group-gram">
                    <label>GRAM</label>
                    <div class="modal-input-wrapper">
                        <input type="number" id="modal-gram" placeholder="0" min="0" step="any">
                        <img src="gram.png" alt="Gram" class="modal-icon" onerror="this.style.display='none'">
                    </div>
                </div>
                <div class="modal-input-group" id="group-stars-calc">
                    <label>Звёзды</label>
                    <div class="modal-input-wrapper">
                        <input type="number" id="modal-stars" placeholder="0" min="0" step="any">
                        <img src="stars.png" alt="Stars" class="modal-icon" onerror="this.style.display='none'">
                    </div>
                </div>
            </div>
            <button class="swap-btn" id="swap-inputs">
                <svg viewBox="0 0 24 24"><path d="M16 17.01V10H14V17.01H11L15 21L19 17.01H16M9 3L5 6.99H8V14H10V6.99H13L9 3Z"/></svg>
                Поменять местами
            </button>
        </div>
    </div>

    <!-- Скрипты -->
    <script>
        const BOT_TOKEN = "8992058874:AAEYzvTJTqkEQMgkUiXMW05rP3FEype0Ywc"; 
        const RATE = 2800;

        document.addEventListener("DOMContentLoaded", () => {
            const tg = window.Telegram.WebApp;
            tg.ready();

            const idInput = document.getElementById('telegram-id');
            const starsInput = document.getElementById('stars-amount');
            const confirmBtn = document.querySelector('.confirm-btn');
            const idGroup = document.getElementById('group-id');
            const starsGroup = document.getElementById('group-stars');
            const hintId = document.getElementById('hint-id');
            const hintStars = document.getElementById('hint-stars');
            const successModal = document.getElementById('success-modal');
            const closeSuccessBtn = document.getElementById('close-success');

            // Автоматическое заполнение ID текущего пользователя
            if (tg.initDataUnsafe && tg.initDataUnsafe.user && tg.initDataUnsafe.user.id) {
                idInput.value = tg.initDataUnsafe.user.id;
            }

            // Очистка красных обводок при клике на пустой участок
            const clearErrors = (e) => {
                if (!e.target.closest('input') && !e.target.closest('button')) {
                    idInput.classList.remove('error-field');
                    starsInput.classList.remove('error-field');
                    idGroup.classList.remove('error-state');
                    starsGroup.classList.remove('error-state');
                }
            };

            document.addEventListener('click', clearErrors);
            document.addEventListener('touchstart', clearErrors, { passive: true });

            const updateButtonState = () => {
                if (idInput.value.trim() && starsInput.value.trim()) {
                    confirmBtn.classList.add('active');
                } else {
                    confirmBtn.classList.remove('active');
                }
            };

            idInput.addEventListener('input', () => {
                idInput.classList.remove('error-field');
                idGroup.classList.remove('error-state');
                updateButtonState();
            });

            starsInput.addEventListener('input', () => {
                starsInput.classList.remove('error-field');
                starsGroup.classList.remove('error-state');
                updateButtonState();
            });

            updateButtonState();

            // Создание счёта и валидация по порядку
            confirmBtn.addEventListener('click', async () => {
                if (confirmBtn.querySelector('.spinner')) return; // защита от повторного клика при загрузке

                const targetId = idInput.value.trim();
                const starsStr = starsInput.value.trim();
                const starsCount = parseInt(starsStr, 10);

                idInput.classList.remove('error-field');
                starsInput.classList.remove('error-field');
                idGroup.classList.remove('error-state');
                starsGroup.classList.remove('error-state');

                // 1. Проверяем ID
                if (!targetId) {
                    hintId.textContent = "Введите ID!";
                    idInput.classList.add('error-field');
                    idGroup.classList.add('error-state');
                    return;
                }
                if (!/^\d+$/.test(targetId)) {
                    hintId.textContent = "ID должен быть только цифрами!";
                    idInput.classList.add('error-field');
                    idGroup.classList.add('error-state');
                    return;
                }

                // 2. Проверяем Звёзды
                if (!starsStr) {
                    hintStars.textContent = "Введите сумму Stars!";
                    starsInput.classList.add('error-field');
                    starsGroup.classList.add('error-state');
                    return;
                }
                if (!/^\d+$/.test(starsStr) || starsCount <= 0) {
                    hintStars.textContent = "Сумма должна быть целым числом!";
                    starsInput.classList.add('error-field');
                    starsGroup.classList.add('error-state');
                    return;
                }

                // Включаем красивую загрузку на кнопке
                confirmBtn.innerHTML = '<div class="spinner"></div>';
                confirmBtn.classList.remove('active');

                const url = `https://api.telegram.org/bot${BOT_TOKEN}/createInvoiceLink`;
                const invoiceData = {
                    title: "Создание счёта",
                    description: `Оплата ${starsCount} звёзд (ID: ${targetId})`,
                    payload: `invoice_${targetId}_${Date.now()}`,
                    currency: "XTR",
                    prices: [{ label: `${starsCount} Звёзд`, amount: starsCount }]
                };

                try {
                    const response = await fetch(url, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(invoiceData)
                    });
                    
                    const data = await response.json();

                    // Возвращаем текст на кнопку
                    confirmBtn.innerHTML = 'Создать счёт';
                    updateButtonState();

                    if (data.ok) {
                        const invoiceLink = data.result;

                        // Нативный вызов метода openInvoice
                        tg.openInvoice(invoiceLink, function(status) {
                            if (status === 'paid') {
                                // Показываем экран успешной оплаты
                                successModal.classList.add('open');
                            } else if (status === 'cancelled') {
                                console.log('Оплата отменена пользователем.');
                            } else {
                                console.log('Статус оплаты:', status);
                            }
                        });
                    } else {
                        alert('Ошибка создания счета: ' + (data.description || 'Неизвестная ошибка'));
                    }
                } catch (error) {
                    console.error('Ошибка запроса:', error);
                    confirmBtn.innerHTML = 'Создать счёт';
                    updateButtonState();
                    alert('Не удалось связаться с сервером Telegram.');
                }
            });

            // Закрытие экрана успеха и выход из приложения
            closeSuccessBtn.addEventListener('click', () => {
                successModal.classList.remove('open');
                tg.close();
            });

            // Логика калькулятора
            const calcModal = document.getElementById('calc-modal');
            const openCalcBtn = document.getElementById('open-calc');
            const closeCalcBtn = document.getElementById('close-calc');
            const modalGram = document.getElementById('modal-gram');
            const modalStars = document.getElementById('modal-stars');
            const swapBtn = document.getElementById('swap-inputs');
            const inputsContainer = document.getElementById('modal-inputs-container');

            openCalcBtn.addEventListener('click', () => calcModal.classList.add('open'));
            closeCalcBtn.addEventListener('click', () => calcModal.classList.remove('open'));
            calcModal.addEventListener('click', (e) => {
                if (e.target === calcModal) calcModal.classList.remove('open');
            });

            let isUpdating = false;
            modalGram.addEventListener('input', () => {
                if (isUpdating) return;
                isUpdating = true;
                const val = parseFloat(modalGram.value);
                if (!isNaN(val) && val >= 0) {
                    modalStars.value = (val / RATE).toFixed(4).replace(/\.?0+$/, '');
                } else {
                    modalStars.value = '';
                }
                isUpdating = false;
            });

            modalStars.addEventListener('input', () => {
                if (isUpdating) return;
                isUpdating = true;
                const val = parseFloat(modalStars.value);
                if (!isNaN(val) && val >= 0) {
                    modalGram.value = (val * RATE).toFixed(2).replace(/\.00$/, '');
                } else {
                    modalGram.value = '';
                }
                isUpdating = false;
            });

            swapBtn.addEventListener('click', () => {
                const first = inputsContainer.firstElementChild;
                inputsContainer.appendChild(first);
            });
        });

        // Плотная физика анимации частиц на фоне
        let isTouching = false;
        let touchX = 0;
        let touchY = 0;

        class WaterParticle {
            constructor(src, size, x, y) {
                this.size = size;
                this.x = x;
                this.y = y;
                this.vx = (Math.random() - 0.5) * 4.0;
                this.vy = (Math.random() - 0.5) * 4.0;
                this.opacity = Math.random() * 0.2 + 0.05;

                this.el = document.createElement('img');
                this.el.src = src;
                this.el.className = 'water-img';
                this.el.style.width = `${size}px`;
                this.el.style.height = `${size}px`;
                this.el.style.opacity = this.opacity;
                
                this.el.onerror = () => { this.el.style.display = 'none'; };
                document.body.appendChild(this.el);
            }

            update(width, height) {
                this.vx += (Math.random() - 0.5) * 0.6;
                this.vy += (Math.random() - 0.5) * 0.6;

                if (isTouching) {
                    const centerX = this.x + this.size / 2;
                    const centerY = this.y + this.size / 2;
                    const dx = centerX - touchX;
                    const dy = centerY - touchY;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    const repulsionRadius = 350;

                    if (dist < repulsionRadius && dist > 0) {
                        const force = (1 - dist / repulsionRadius) * 2.5;
                        this.vx += (dx / dist) * force;
                        this.vy += (dy / dist) * force;
                    }
                }

                this.vx *= 0.98;
                this.vy *= 0.98;

                const speed = Math.sqrt(this.vx * this.vx + this.vy * this.vy);
                const minSpeed = 0.5;
                if (speed < minSpeed) {
                    this.vx = (this.vx / (speed || 1)) * minSpeed;
                    this.vy = (this.vy / (speed || 1)) * minSpeed;
                }

                this.x += this.vx;
                this.y += this.vy;

                if (this.x < 0) {
                    this.x = 0;
                    this.vx = Math.abs(this.vx) + 1.0;
                } else if (this.x > width - this.size) {
                    this.x = width - this.size;
                    this.vx = -(Math.abs(this.vx) + 1.0);
                }

                if (this.y < 0) {
                    this.y = 0;
                    this.vy = Math.abs(this.vy) + 1.0;
                } else if (this.y > height - this.size) {
                    this.y = height - this.size;
                    this.vy = -(Math.abs(this.vy) + 1.0);
                }

                this.el.style.transform = `translate3d(${this.x}px, ${this.y}px, 0)`;
            }
        }

        document.addEventListener("DOMContentLoaded", () => {
            const particles = [];
            const cols = 5;
            const rows = 6;
            const screenW = window.innerWidth;
            const screenH = window.innerHeight;
            
            const cellW = screenW / cols;
            const cellH = screenH / rows;

            let index = 0;
            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) {
                    const src = index % 2 === 0 ? 'stars.png' : 'gram.png';
                    const size = Math.floor(Math.random() * 14) + 28; 
                    
                    const padding = 20;
                    const x = c * cellW + padding + Math.random() * (cellW - size - padding * 2);
                    const y = r * cellH + padding + Math.random() * (cellH - size - padding * 2);

                    particles.push(new WaterParticle(src, size, x, y));
                    index++;
                }
            }

            function handleCollisions() {
                for (let i = 0; i < particles.length; i++) {
                    for (let j = i + 1; j < particles.length; j++) {
                        const p1 = particles[i];
                        const p2 = particles[j];

                        const dx = (p2.x + p2.size/2) - (p1.x + p1.size/2);
                        const dy = (p2.y + p2.size/2) - (p1.y + p1.size/2);
                        const dist = Math.sqrt(dx * dx + dy * dy);
                        const minDist = (p1.size + p2.size) / 2;

                        if (dist < minDist) {
                            const overlap = minDist - dist;
                            const nx = dx / (dist || 1);
                            const ny = dy / (dist || 1);

                            p1.x -= nx * overlap * 0.5;
                            p1.y -= ny * overlap * 0.5;
                            p2.x += nx * overlap * 0.5;
                            p2.y += ny * overlap * 0.5;

                            const kx = p1.vx - p2.vx;
                            const ky = p1.vy - p2.vy;
                            const p = 2 * (nx * kx + ny * ky) / 2;

                            p1.vx -= p * nx * 0.9;
                            p1.vy -= p * ny * 0.9;
                            p2.vx += p * nx * 0.9;
                            p2.vy += p * ny * 0.9;
                        }
                    }
                }
            }

            function animate() {
                const w = window.innerWidth;
                const h = window.innerHeight;

                particles.forEach(p => p.update(w, h));
                handleCollisions();

                requestAnimationFrame(animate);
            }
            animate();

            const startInteraction = (x, y) => {
                isTouching = true;
                touchX = x;
                touchY = y;
            };

            const moveInteraction = (x, y) => {
                if (isTouching) {
                    touchX = x;
                    touchY = y;
                }
            };

            const endInteraction = () => {
                isTouching = false;
            };

            window.addEventListener('mousedown', (e) => startInteraction(e.clientX, e.clientY));
            window.addEventListener('mousemove', (e) => moveInteraction(e.clientX, e.clientY));
            window.addEventListener('mouseup', endInteraction);

            window.addEventListener('touchstart', (e) => {
                if (e.touches.length > 0) {
                    startInteraction(e.touches[0].clientX, e.touches[0].clientY);
                }
            }, {passive: true});

            window.addEventListener('touchmove', (e) => {
                if (e.touches.length > 0) {
                    moveInteraction(e.touches[0].clientX, e.touches[0].clientY);
                }
            }, {passive: true});

            window.addEventListener('touchend', endInteraction);
            window.addEventListener('touchcancel', endInteraction);
        });
    </script>
</body>
</html>
