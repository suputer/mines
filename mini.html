<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telegram Mini App - User ID</title>
    <!-- Официальный скрипт Telegram Web App -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--tg-theme-bg-color, #ffffff);
            color: var(--tg-theme-text-color, #000000);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            box-sizing: border-box;
        }
        .container {
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        button {
            background-color: var(--tg-theme-button-color, #2481cc);
            color: var(--tg-theme-button-text-color, #ffffff);
            border: none;
            border-radius: 8px;
            padding: 12px 20px;
            font-size: 16px;
            cursor: pointer;
            width: 100%;
            margin-bottom: 20px;
        }
        .console {
            background-color: #1e1e1e;
            color: #00ff00;
            padding: 15px;
            border-radius: 8px;
            text-align: left;
            font-family: monospace;
            font-size: 13px;
            height: 180px;
            overflow-y: auto;
            box-sizing: border-box;
            border: 1px solid #333;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Получение ID в Telegram</h2>
        <button id="getIdBtn">Узнать мой ID</button>
        
        <h3>Лог-консоль:</h3>
        <div id="consoleLog" class="console">Приложение запущенно. Ожидание клика...</div>
    </div>

    <script>
        // Функция для вывода текста в визуальную консоль на экране
        function logToScreen(message, isError = false) {
            const consoleDiv = document.getElementById('consoleLog');
            const timestamp = new Date().toLocaleTimeString();
            const color = isError ? '#ff5555' : '#00ff00';
            consoleDiv.innerHTML += `<div style="color: ${color};">[${timestamp}] ${message}</div>`;
            consoleDiv.scrollTop = consoleDiv.scrollHeight;
        }

        // Инициализация Telegram WebApp
        const tg = window.Telegram.WebApp;
        tg.ready();

        // Обработчик нажатия на кнопку
        document.getElementById('getIdBtn').addEventListener('click', function() {
            logToScreen("Кнопка нажата...");
            
            try {
                // Проверяем наличие данных пользователя
                if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
                    const user = tg.initDataUnsafe.user;
                    
                    logToScreen(`Успешно получено!`);
                    logToScreen(`ID: ${user.id}`);
                    logToScreen(`Имя: ${user.first_name || 'Не указано'}`);
                    logToScreen(`Username: @${user.username || 'нет'}`);
                } else {
                    logToScreen("⚠️ Данные пользователя недоступны.", true);
                    logToScreen("Убедитесь, что открыли приложение через Telegram, а не в обычном браузере.", true);
                    logToScreen("initDataUnsafe: " + JSON.stringify(tg.initDataUnsafe), true);
                }
            } catch (error) {
                logToScreen("❌ Ошибка: " + error.message, true);
            }
        });
    </script>

</body>
</html>
